name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Typecheck
        run: pnpm typecheck
        env:
          NEXT_PUBLIC_USE_MOCK_SERVICES: 'true'

      - name: Lint
        run: pnpm lint

      - name: Unit & Integration Tests
        run: pnpm test
        env:
          NEXT_PUBLIC_USE_MOCK_SERVICES: 'true'

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_USE_MOCK_SERVICES: 'true'

      - name: Bundle size budget
        run: |
          SIZE_KB=$(du -sk .next/static | cut -f1)
          echo "Next static assets: ${SIZE_KB} KB"
          if [ "$SIZE_KB" -gt 4096 ]; then
            echo "Static bundle exceeds 4 MB budget (${SIZE_KB} KB)"
            exit 1
          fi

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke
        run: pnpm exec playwright test tests/e2e/explore.spec.ts --project=chromium
        env:
          NEXT_PUBLIC_USE_MOCK_SERVICES: 'true'
